# Copy to ~/.hermes/pi-bridge-models.yaml
#
# This file contains model-routing preferences only. Do not put API keys here.
# Empty provider/model values mean: use pi's configured default.
# Hermes should read this file and pass non-empty values to pi_task or
# pi_session_start.

version: 1

routing:
  policy: cheapest-suitable-then-escalate
  escalation_signals:
    - low-confidence
    - contradictory-evidence
    - unresolved-key-or-session-derivation
    - repeated-failed-hypothesis
    - native-managed-network-correlation-needed

fast:
  provider: ""
  model: ""
  thinking: minimal
  intended_for:
    - grep-and-search
    - jadx-triage
    - strings-and-symbols
    - pcap-field-extraction
    - log-formatting
    - documentation-updates

code:
  provider: ""
  model: ""
  thinking: medium
  intended_for:
    - frida-hooks
    - mitmproxy-addons
    - protocol-parsers
    - python-poc
    - tests
    - home-assistant-code

deep:
  provider: ""
  model: ""
  thinking: high
  intended_for:
    - unknown-state-machines
    - crypto-and-key-flow
    - obfuscated-native-code
    - cross-layer-correlation
    - contradictory-evidence
    - experiment-planning-after-dead-ends
