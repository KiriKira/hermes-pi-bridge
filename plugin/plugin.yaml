name: pi-bridge
version: 1.1.0
description: "Hermes bridge for delegating execution to pi and orchestrating pi_flow workflows"
author: hermes-pi-bridge
provides_tools:
  - pi_check
  - pi_task
  - pi_session_start
  - pi_session_send
  - pi_session_read
  - pi_session_stop
  - pi_session_list
provides_hooks:
  - pre_llm_call
  - on_session_end
